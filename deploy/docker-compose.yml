# Hạ tầng cho môi trường dev KHÔNG dùng Aspire, hoặc cho CI chạy E2E.
# Cách khuyến nghị vẫn là: dotnet run --project BackEnd/src/Aspire/MyCloud.AppHost
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Mật khẩu dưới đây chỉ dành cho máy dev; ghi đè bằng file .env (không commit) khi cần.
# Image service (.NET) sẽ được bổ sung ở Phase 6 (dotnet publish /t:PublishContainer).
name: mycloud

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mycloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mycloud-dev}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mycloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mycloud-dev}
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    # minio/minio đã bị gỡ khỏi Docker Hub — dùng bản build từ source của Chainguard, ghim digest (ADR-011).
    image: cgr.dev/chainguard/minio@sha256:aea6c163749e1caca37f907976dcf337177ddf5f558808f2aa591618fd3a6eef
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mycloud}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mycloud-dev-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
  minio-data:
